# 自動把排班表網頁發布到 GitHub Pages
# 網址：https://nastya-777.github.io/Jiuwu/
name: Publish schedule site

on:
  push:
    branches:
      - main
      - claude/jiuwu-animal-hospital-schedule-hcnsp7
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable and configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stamp asset versions (cache busting)
        run: |
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html
          grep -n '?v=' index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
